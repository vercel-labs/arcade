<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>viewport check</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #000; color: #ededed; font: 500 12px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace; }
  body { height: 300vh; }
  /* Fixed probes: if either banner is invisible in the screenshot, the layout
     viewport extends behind the browser chrome. */
  .edge { position: fixed; left: 0; right: 0; z-index: 5; height: 30px; padding: 7px 10px; color: #000; font: 700 12px/1.2 ui-monospace, monospace; }
  .edge--top { top: 0; background: #ff2fd0; }
  .edge--bottom { bottom: 0; background: #35e07a; }
  /* Unit probes: each bar is one viewport unit tall, measured from the top of
     the layout viewport. Whichever bar ends exactly at the visible bottom edge
     is the unit that matches reality. */
  .bars { position: fixed; z-index: 4; top: 0; left: 0; display: flex; gap: 3px; padding-left: 4px; }
  .bar { width: 22px; padding-top: 34px; text-align: center; font: 700 11px/1 ui-monospace, monospace; color: #000; }
  .bar--svh { height: 100svh; background: #ff5c5c; }
  .bar--dvh { height: 100dvh; background: #5cc8ff; }
  .bar--lvh { height: 100lvh; background: #ffd24a; }
  /* Pinned near the middle so it stays on screen whichever edge is obscured. */
  .readout { position: fixed; z-index: 6; top: 26%; right: 4px; left: 84px; margin: 0; padding: 8px; border: 1px solid #555; background: rgb(0 0 0 / 94%); overflow: hidden; white-space: pre; font-size: 10px; line-height: 1.35; }
</style>
</head>
<body>
<div class="edge edge--top">FIXED top:0</div>
<div class="edge edge--bottom">FIXED bottom:0</div>
<div class="bars">
  <div class="bar bar--svh" id="probe-svh">s</div>
  <div class="bar bar--dvh" id="probe-dvh">d</div>
  <div class="bar bar--lvh" id="probe-lvh">l</div>
</div>
<pre class="readout" id="readout">booting…</pre>
<script>
(() => {
  const readout = document.getElementById('readout');
  const probe = (id) => Math.round(document.getElementById(id).getBoundingClientRect().height);
  const rows = [];
  let last = '';
  const sample = (label) => {
    const visual = window.visualViewport;
    // Short tokens: the whole row has to fit a phone's width to be screenshot-readable.
    const line = [
      `in${window.innerHeight}`,
      `cl${document.documentElement.clientHeight}`,
      `vv${visual ? Math.round(visual.height) : '-'}`,
      `of${visual ? Math.round(visual.offsetTop) : '-'}`,
      `pt${visual ? Math.round(visual.pageTop) : '-'}`,
      `s${probe('probe-svh')}`,
      `d${probe('probe-dvh')}`,
      `l${probe('probe-lvh')}`,
      `y${Math.round(window.scrollY)}`,
    ].join(' ');
    // Only record changes: a short list stays readable in one screenshot.
    if (line === last && !label.startsWith('!')) return;
    last = line;
    rows.push(`${label.padEnd(8)}${line}`);
    if (rows.length > 20) rows.splice(0, rows.length - 20);
    readout.textContent = `scr ${screen.width}x${screen.height} dpr${window.devicePixelRatio} sc${window.visualViewport?.scale.toFixed(2) ?? '-'}\n${rows.join('\n')}`;
  };

  sample('load');
  for (const delay of [30, 80, 150, 250, 400, 600, 850, 1200]) setTimeout(() => sample(`t${delay}`), delay);
  for (const type of ['resize', 'orientationchange', 'pageshow', 'scroll']) {
    window.addEventListener(type, () => sample(type), { passive: true });
  }
  window.visualViewport?.addEventListener('resize', () => sample('vvsize'));
  window.visualViewport?.addEventListener('scroll', () => sample('vvscrl'));

  // Decisive experiment: does a programmatic scroll make the browser commit the
  // real toolbar geometry, the way the user's own finger does?
  setTimeout(() => {
    sample('!pre');
    window.scrollTo(0, 1);
    requestAnimationFrame(() => {
      sample('!nudge');
      window.scrollTo(0, 0);
      setTimeout(() => sample('!post'), 120);
    });
  }, 1600);
})();
</script>
</body>
</html>
