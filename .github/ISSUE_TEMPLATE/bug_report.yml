name: Bug report
description: Report reproducible Arcade behavior
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private prompts, or sensitive data. Report security issues through https://github.com/vercel-labs/arcade/security/policy.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest set of commands or actions that reproduces the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Arcade version
      placeholder: 0.x.y or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Node version, terminal, and display mode
  - type: textarea
    id: evidence
    attributes:
      label: Additional evidence
      description: Add redacted logs or snapshots if they help explain the issue.
